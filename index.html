<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f6fa" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Luã &amp; May">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Treino e alimentação de Luã e May">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Luã &amp; May · Treino</title>
<style>
/* ============ TEMA (escuro padrão, claro pelo sistema) ============ */
:root{
  --bg:#0b1220; --bg2:#101b2c; --card:#172438; --line:#2c3b50; --line2:#455873;
  --tx:#edf3fb; --mut:#b3c2d5; --ac:#71e7ca; --ac-tx:#06231c; --ac2:#25453f; --ac3:#182f2d;
  --warn:#ffc46b; --bad:#ff7d7d; --ok:#71e7ca; --inp:#0c1728;
  --tabh:60px; --r:16px;
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
  --sl:env(safe-area-inset-left); --sr:env(safe-area-inset-right);
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root{ --bg:#f3f6fa; --bg2:#ffffff; --card:#ffffff; --line:#d8e0ea; --line2:#b9c6d6;
    --tx:#0b1220; --mut:#4f5f73; --ac:#0f8f75; --ac-tx:#ffffff; --ac2:#d5f5ec; --ac3:#e8faf5;
    --warn:#a35b00; --bad:#c62828; --ok:#0f8f75; --inp:#f7f9fc; color-scheme:light; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;
  min-height:100dvh;overscroll-behavior-y:none;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}
a{color:var(--ac)}
h1{font-size:28px;line-height:1.15;margin:4px 0 8px}
h2{font-size:21px;margin:18px 0 8px}
h3{font-size:18px;margin:0 0 6px}
h4{font-size:16px;margin:0 0 4px}
p{margin:6px 0}
.mut{color:var(--mut)} .sm{font-size:13px} .xs{font-size:12px}
.tag{font-size:12px;letter-spacing:2px;color:var(--ac);text-transform:uppercase;font-weight:600}
.ac{color:var(--ac)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.b{font-weight:700} .c{text-align:center} .r{text-align:right}
.row{display:flex;gap:8px;align-items:center} .row.w{flex-wrap:wrap} .grow{flex:1;min-width:0}
.sp{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hide{display:none!important}

/* ============ ESTRUTURA ============ */
#top{position:sticky;top:0;z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  padding:calc(var(--st) + 8px) calc(var(--sr) + 14px) 8px calc(var(--sl) + 14px);border-bottom:1px solid var(--line)}
#top .row{min-height:44px}
#title{font-weight:700;font-size:17px}
#view{max-width:720px;margin:auto;padding:12px calc(var(--sr) + 14px) calc(var(--tabh) + var(--sb) + 110px) calc(var(--sl) + 14px);
  animation:fade .16s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#view{animation:none}}

#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--bg2);background:color-mix(in srgb,var(--bg2) 92%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:0 var(--sr) var(--sb) var(--sl)}
#tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:var(--tabh);
  text-decoration:none;color:var(--mut);font-size:11px;gap:2px;min-width:44px}
#tabs a svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs a.on{color:var(--ac)}

/* ============ COMPONENTES ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.card.flat{background:var(--bg2)}
.card.hl{border-color:var(--ac)}
.card.warnc{border-color:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:12px;
  border:1px solid var(--line2);background:var(--bg2);color:var(--tx);font-weight:600;text-decoration:none;cursor:pointer;user-select:none}
.btn:active{transform:scale(.97);opacity:.85}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--ac-tx)}
.btn.sec{background:var(--ac2);border-color:var(--ac2);color:var(--tx)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.big{width:100%;min-height:58px;font-size:19px;border-radius:16px}
.btn.wide{width:100%}
.btn.sm{min-height:44px;padding:6px 12px;font-size:14px}
.btn.icon{width:44px;padding:0}
.btn[disabled]{opacity:.4}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:6px 12px;border-radius:999px;border:1px solid var(--line2);
  background:var(--bg2);font-size:14px;margin:3px 4px 3px 0;cursor:pointer}
.chip.on{background:var(--ac2);border-color:var(--ac);color:var(--tx)}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--mut);font-weight:600}
.seg button.on{background:var(--ac);color:var(--ac-tx)}
.list{list-style:none;padding:0;margin:0}
.list>li{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 2px;border-bottom:1px solid var(--line)}
.list>li:last-child{border-bottom:0}
.lnk{display:flex;align-items:center;gap:10px;min-height:52px;padding:10px 14px;border-radius:14px;background:var(--card);
  border:1px solid var(--line);margin:8px 0;text-decoration:none;color:var(--tx);font-weight:600}
.lnk::after{content:'›';margin-left:auto;color:var(--mut);font-size:22px}
label.fld{display:block;margin:8px 0}
label.fld>span{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
input[type=text],input[type=number],input[type=date],input[type=time],input:not([type]),select,textarea{
  font-size:16px;width:100%;min-height:44px;background:var(--inp);color:var(--tx);border:1px solid var(--line2);border-radius:10px;padding:9px 10px}
textarea{min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:0}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--ac);flex:none}
.ck{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.note{font-size:14px;color:var(--mut)}
.alert{border-left:4px solid var(--warn);background:var(--bg2);background:color-mix(in srgb,var(--warn) 12%,transparent);padding:10px 12px;border-radius:10px;margin:10px 0;font-size:14px}
.alert.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.alert.ok{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--ac2);color:var(--tx);font-weight:600}
.pill.w{background:color-mix(in srgb,var(--warn) 25%,transparent)}
.est{font-size:11px;color:var(--warn);font-weight:700}
.hr{height:1px;background:var(--line);margin:12px 0}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:22px} .kpi span{font-size:12px;color:var(--mut)}
details>summary{min-height:44px;display:flex;align-items:center;font-weight:600;cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:'▸';margin-right:8px;color:var(--ac);transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}

/* Perfil */
.prof{display:flex;gap:6px}
.prof button{min-height:38px;min-width:58px;border-radius:999px;border:1px solid var(--line2);background:var(--bg2);font-weight:700;color:var(--mut)}
.prof button.on{background:var(--ac);border-color:var(--ac);color:var(--ac-tx)}

/* ============ TREINO ============ */
.ex{padding:12px}
.ex.done{border-color:var(--ac)}
.ex .hd{display:flex;gap:10px;align-items:flex-start}
.ex .thumb{width:58px;height:58px;border-radius:10px;object-fit:cover;background:#fff;flex:none;cursor:zoom-in}
.ex .meta{font-size:13px;color:var(--mut)}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:6px;align-items:center;margin-top:10px}
.sets .h{font-size:12px;color:var(--mut);text-align:center}
.sets .n{font-weight:700;text-align:center;color:var(--mut)}
.stp{display:flex;align-items:center;border:1px solid var(--line2);border-radius:10px;background:var(--inp);overflow:hidden}
.stp button{width:36px;min-height:44px;border:0;background:transparent;color:var(--ac);font-size:20px;font-weight:700;flex:none}
.stp input{border:0;border-radius:0;min-height:44px;text-align:center;padding:4px 0;background:transparent;width:100%;min-width:0}
.stp input:focus{outline:none}
.setck{width:48px;height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);font-size:20px;color:var(--mut)}
.setck.on{background:var(--ac);border-color:var(--ac);color:var(--ac-tx)}
.sets .rowdone .stp{border-color:var(--ac)}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .25s}
.sug{background:var(--ac3);border:1px dashed var(--ac);border-radius:12px;padding:10px;margin-top:10px;font-size:14px}

/* Timer de descanso (fica acima da barra de abas) */
#rest{position:fixed;left:calc(var(--sl) + 10px);right:calc(var(--sr) + 10px);bottom:calc(var(--tabh) + var(--sb) + 10px);z-index:40;
  background:var(--card);border:1px solid var(--ac);border-radius:18px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.35);
  max-width:700px;margin:auto}
#rest .t{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;min-width:96px}
#rest.over{border-color:var(--warn)}
#rest.over .t{color:var(--warn)}

/* Calendário */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .w{font-size:12px;color:var(--mut)}
.cal .d{min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;background:var(--bg2);font-size:14px;border:1px solid transparent}
.cal .d.has{background:var(--ac2);border-color:var(--ac);font-weight:700;cursor:pointer}
.cal .d.rec{border-color:var(--ac);border-style:dashed}
.cal .d.today{outline:2px solid var(--mut)}
.cal .d.o{opacity:0}

/* Modal / folha inferior */
#sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5)}
#sheet .in{background:var(--bg2);width:100%;max-width:720px;max-height:88dvh;overflow:auto;border-radius:20px 20px 0 0;
  padding:16px calc(var(--sr) + 16px) calc(var(--sb) + 18px) calc(var(--sl) + 16px);animation:up .18s ease}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
#zoom{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;overflow:auto;
  padding:calc(var(--st) + 10px) 10px calc(var(--sb) + 10px)}
#zoom img{max-width:100%;max-height:100%;touch-action:pinch-zoom;background:#fff;border-radius:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + var(--sb) + 16px);z-index:80;background:var(--tx);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:90vw;text-align:center}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.photos img,.photos .ph{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:#fff;cursor:zoom-in}
.ph{display:flex;align-items:center;justify-content:center;background:var(--bg2)!important;border:1px dashed var(--line2);color:var(--mut);font-size:13px;text-align:center;padding:8px}

/* ============ COMIDA ============ */
.meal{display:flex;gap:10px;align-items:center}
.meal .st{display:flex;gap:4px;margin-top:8px}
.meal .st button{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);font-size:14px;font-weight:600;color:var(--mut)}
.meal .st button.on{background:var(--ac);border-color:var(--ac);color:var(--ac-tx)}
.meal .st button.skip.on{background:var(--line2);border-color:var(--line2);color:var(--tx)}
.rings{display:flex;justify-content:space-around;gap:6px}
.ring{text-align:center;font-size:12px;color:var(--mut)}
.ring svg{width:92px;height:92px;display:block;margin:auto}
.bar{margin:8px 0} .bar .l{display:flex;justify-content:space-between;font-size:13px}
.bar .prog{height:9px}
.bar .prog i.over{background:var(--warn)}
.plan{display:grid;grid-template-columns:44px repeat(4,1fr);gap:4px;font-size:12px}
.plan .c{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:6px 4px;min-height:58px;cursor:pointer;line-height:1.2}
.plan .c.t{background:var(--ac3)}
.plan .hh{font-weight:700;color:var(--mut);text-align:center;font-size:11px}
.plan .dd{font-weight:700;display:flex;align-items:center;justify-content:center}
.stars button{background:none;border:0;font-size:24px;min-width:36px;min-height:44px;color:var(--line2)}
.stars button.on{color:#f5c84b}
.step{font-size:24px;line-height:1.45;min-height:40dvh;display:flex;align-items:center}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}

/* ============ GRÁFICOS ============ */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mut);font-size:10px}
.chart .ln{fill:none;stroke:var(--ac);stroke-width:2.2}
.chart .ln2{fill:none;stroke:var(--warn);stroke-width:2;stroke-dasharray:4 3}
.chart .gd{stroke:var(--line);stroke-width:1}
.chart .bx{fill:var(--ac)}
.chart .dt{fill:var(--ac)}
.legend{font-size:12px;color:var(--mut);display:flex;gap:12px}
.legend i{display:inline-block;width:12px;height:3px;background:var(--ac);vertical-align:middle;margin-right:4px}
.legend i.w{background:var(--warn)}
.badge{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.badge .ic{font-size:26px;width:40px;text-align:center}
.badge.off{opacity:.38}

@media (orientation:landscape) and (max-height:500px){
  :root{--tabh:50px}
  #tabs a span{display:none}
}

</style>
</head>
<body>
<header id="top">
  <div class="row">
    <button id="back" class="btn icon hide" data-act="back" aria-label="Voltar">‹</button>
    <div id="title" class="grow">Hoje</div>
    <button id="upd" class="btn sm pri hide">Nova versão — atualizar</button>
    <div class="prof" role="group" aria-label="Perfil">
      <button data-act="profile" data-p="lua">Luã</button>
      <button data-act="profile" data-p="may">May</button>
    </div>
  </div>
</header>
<main id="view" aria-live="polite"><p class="mut">Carregando…</p></main>
<nav id="tabs" aria-label="Navegação principal">

  <a href="#/treino" data-tab="treino"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 9v6M21 9v6M6 12h12"/></svg><span>Treino</span></a>
  <a href="#/comida" data-tab="comida"><svg viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v6M9 3v6M17 21V3c-2 1-3 4-3 8h3"/></svg><span>Comida</span></a>
  <a href="#/progresso" data-tab="progresso"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Progresso</span></a>

</nav>

<script>
/* =====================================================================
   DADOS-BASE (conteúdo original preservado + estrutura para o app)
   ===================================================================== */
const IMG_BASE = 'https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/';

/* Catálogo de exercícios. photo = pasta do free-exercise-db (0.jpg / 1.jpg) */
const EXERCISES = {
  puxada:      { name: 'Puxada pela frente',          group: 'Costas',     photo: 'Wide-Grip_Lat_Pulldown' },
  remada:      { name: 'Remada com peito apoiado',    group: 'Costas',     photo: 'Leverage_High_Row' },
  supino:      { name: 'Supino na máquina',           group: 'Peito',      photo: 'Machine_Bench_Press' },
  elevacao:    { name: 'Elevação lateral na máquina', group: 'Ombros',     photo: 'Side_Lateral_Raise',
                 photoNote: 'Foto de referência com halteres (mesmo movimento). Na máquina, mantenha o tronco apoiado e suba até a linha dos ombros.' },
  rosca:       { name: 'Rosca na máquina',            group: 'Bíceps',     photo: 'Machine_Preacher_Curls' },
  triceps:     { name: 'Tríceps na polia',            group: 'Tríceps',    photo: 'Triceps_Pushdown' },
  extensora:   { name: 'Cadeira extensora',           group: 'Quadríceps', photo: 'Leg_Extensions' },
  flexora:     { name: 'Flexora sentada',             group: 'Posterior',  photo: 'Seated_Leg_Curl' },
  abdutora:    { name: 'Cadeira abdutora',            group: 'Glúteos',    photo: 'Thigh_Abductor' },
  panturrilha: { name: 'Panturrilha sentada',         group: 'Panturrilha',photo: 'Seated_Calf_Raise' },
  legpress:    { name: 'Leg press',                   group: 'Quadríceps', photo: 'Leg_Press' },
  remadaBaixa: { name: 'Remada baixa na polia',       group: 'Costas',     photo: 'Seated_Cable_Rows' },
  desenvolv:   { name: 'Desenvolvimento com halteres',group: 'Ombros',     photo: 'Dumbbell_Shoulder_Press' },
  roscaMartelo:{ name: 'Rosca martelo',               group: 'Bíceps',     photo: 'Hammer_Curls' },
  flexoraDeit: { name: 'Mesa flexora',                group: 'Posterior',  photo: 'Lying_Leg_Curls' },
  pantEmPe:    { name: 'Panturrilha em pé',           group: 'Panturrilha',photo: 'Standing_Calf_Raises' },
  agachTaca:   { name: 'Agachamento taça',            group: 'Quadríceps', photo: 'Goblet_Squat' },
  /* Adicionados na revisão dos treinos (v3.1) */
  puxadaFech:  { name: 'Puxada com pegada fechada',   group: 'Costas',     photo: 'Close-Grip_Front_Lat_Pulldown' },
  facePull:    { name: 'Face pull na polia',          group: 'Ombros',     photo: 'Face_Pull' },
  roscaAlt:    { name: 'Rosca alternada com halteres',group: 'Bíceps',     photo: 'Dumbbell_Alternate_Bicep_Curl' },
  triFrances:  { name: 'Tríceps francês na polia',    group: 'Tríceps',    photo: 'Cable_Rope_Overhead_Triceps_Extension' },
  stiff:       { name: 'Stiff com halteres',          group: 'Posterior',  photo: 'Stiff-Legged_Dumbbell_Deadlift' },
  hipThrust:   { name: 'Elevação pélvica',            group: 'Glúteos',    photo: 'Barbell_Hip_Thrust' },
  afundo:      { name: 'Afundo com halteres',         group: 'Quadríceps', photo: 'Dumbbell_Lunges' },
  /* Adicionados na v3.2 (inferiores só em máquina) */
  hack:        { name: 'Agachamento no hack',         group: 'Quadríceps', photo: 'Hack_Squat' },
  adutora:     { name: 'Cadeira adutora',             group: 'Adutores',   photo: 'Thigh_Adductor' },

/* ---------- Armazenamento: IndexedDB com fallback localStorage ---------- */
const DB = {
  name: 'treino-lua-may', store: 'kv', db: null, mode: 'idb',
  async open() {
    if (!('indexedDB' in window)) { this.mode = 'ls'; return; }
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open(this.name, 1);
        r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains(this.store)) r.result.createObjectStore(this.store); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        setTimeout(() => rej(new Error('timeout')), 4000);
      });
    } catch (e) { console.warn('IDB indisponível, usando localStorage', e); this.mode = 'ls'; }
  },
  tx(mode) { return this.db.transaction(this.store, mode).objectStore(this.store); },
  async all() {
    if (this.mode === 'ls') {
      const o = {}; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('tlm:')) try { o[k.slice(4)] = JSON.parse(localStorage.getItem(k)); } catch (e) {} }
      return o;
    }
    return new Promise((res, rej) => {
      const o = {}; const st = this.tx('readonly'); const c = st.openCursor();
      c.onsuccess = () => { const cur = c.result; if (cur) { o[cur.key] = cur.value; cur.continue(); } else res(o); };
      c.onerror = () => rej(c.error);
    });
  },
  async set(k, v) {
    if (this.mode === 'ls') { try { localStorage.setItem('tlm:' + k, JSON.stringify(v)); } catch (e) { toast('Sem espaço para salvar!'); } return; }
    return new Promise((res, rej) => { const r = this.tx('readwrite').put(v, k); r.onsuccess = res; r.onerror = () => rej(r.error); });
  },
  async del(k) {
    if (this.mode === 'ls') { localStorage.removeItem('tlm:' + k); return; }
    return new Promise(res => { const r = this.tx('readwrite').delete(k); r.onsuccess = res; r.onerror = res; });
  },
  async clear() {
    if (this.mode === 'ls') { Object.keys(localStorage).filter(k => k.startsWith('tlm:')).forEach(k => localStorage.removeItem(k)); return; }
    return new Promise(res => { const r = this.tx('readwrite').clear(); r.onsuccess = res; r.onerror = res; });
  }
};

/* ---------- Store: cópia em memória + gravação assíncrona ---------- */
const Store = {
  d: {},
  get(k, def) { return k in this.d ? this.d[k] : def; },
  set(k, v) { this.d[k] = v; DB.set(k, v).catch(e => { console.error(e); toast('Erro ao salvar'); }); },
  del(k) { delete this.d[k]; DB.del(k); },
  keys(prefix) { return Object.keys(this.d).filter(k => k.startsWith(prefix)); }
};

/* Migrações de schema: cada função leva de (n-1) para n */
const MIGRATIONS = {
  1: () => { /* schema inicial: nada a migrar */ },
  2: () => { // v2: garante campos novos nos perfis (porções, metas, incrementos)
    for (const id of Object.keys(DEFAULT_PROFILES)) {
      const p = Store.get('profile:' + id); if (!p) continue;
      p.portion = p.portion || { cafe: 1, almoco: 1, lanche: 1, jantar: 1 };
      p.inc = p.inc || {};
      Store.set('profile:' + id, p);
    }
  },
  3: () => { // v3: novos treinos (inferiores A ≠ B; mais braço no Luã). Só troca dias que o usuário NÃO editou.
    for (const id of Object.keys(DEFAULT_PROFILES)) {
      const p = Store.get('profile:' + id); if (!p || !p.plan) continue;
      for (const d of [1, 2, 4, 5]) {
        if (JSON.stringify(p.plan[d]) === JSON.stringify(OLD_PLANS_V1[id][d])) p.plan[d] = clone(DEFAULT_PLANS[id][d]);
      }
      Store.set('profile:' + id, p);
    }
  },
  4: () => { // v4: inferiores do Luã só em máquina. Só troca se o dia não foi editado.
    const p = Store.get('profile:lua'); if (!p || !p.plan) return;
    for (const d of [2, 5]) if (JSON.stringify(p.plan[d]) === JSON.stringify(OLD_LUA_V31[d])) p.plan[d] = clone(DEFAULT_PLANS.lua[d]);
    Store.set('profile:lua', p);
  }
};
function runMigrations() {
  const meta = Store.get('meta', { schema: 0 });
  for (let v = (meta.schema || 0) + 1; v <= SCHEMA; v++) { if (MIGRATIONS[v]) MIGRATIONS[v](); }
  if (meta.schema !== SCHEMA) { meta.schema = SCHEMA; Store.set('meta', meta); }
}

/* ---------- Áudio (aviso sonoro do descanso) ---------- */
const Sound = {
  ctx: null,
  unlock() { // precisa ser chamado num toque do usuário (regra do iOS)
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
      const o = this.ctx.createOscillator(), g = this.ctx.createGain(); g.gain.value = 0.0001; o.connect(g).connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime + 0.02);
    } catch (e) {}
  },
  beep(times = 3) {
    if (!this.ctx || meta().sound === false) return;
    try {
      if (this.ctx.state === 'suspended') this.ctx.resume();
      for (let i = 0; i < times; i++) {
        const t = this.ctx.currentTime + i * 0.28, o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = 'sine'; o.frequency.value = i === times - 1 ? 1175 : 880;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
        o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + 0.25);
      }
    } catch (e) {}
  }
};

/* ---------- Compartilhar / baixar arquivos (folha do iOS) ---------- */
async function shareFile(name, content, type) {
  const blob = new Blob([content], { type });
  try {
    const file = new File([blob], name, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; }
  } catch (e) { if (e.name === 'AbortError') return false; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); return true;
}
async function shareText(text, title) {
  try { if (navigator.share) { await navigator.share({ text, title }); return; } } catch (e) { if (e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast('Copiado! Cole no Lembretes.'); } catch (e) { sheet(`<h3>Copie o texto</h3><textarea style="min-height:50dvh">${esc(text)}</textarea>`); }
}

/* =====================================================================
   ROTEADOR (hash) + delegação de eventos
   ===================================================================== */
const Routes = {};     // padrão -> { tab, title, render(params) -> html, after?(params) }
const Actions = {};    // data-act -> fn(el, ev)
const Inputs = {};     // data-in  -> fn(el, ev)
let curRoute = null;

function route(pattern, def) { Routes[pattern] = def; }
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }
function match() {
  const h = (location.hash || '#/hoje').slice(1);
  for (const pat of Object.keys(Routes)) {
    const ps = pat.split('/'), hs = h.split('/'); if (ps.length !== hs.length) continue;
    const params = {}; let ok = true;
    ps.forEach((p, i) => { if (p.startsWith(':')) params[p.slice(1)] = decodeURIComponent(hs[i]); else if (p !== hs[i]) ok = false; });
    if (ok) return { def: Routes[pat], params, pat };
  }
  return { def: Routes['/hoje'], params: {}, pat: '/hoje' };
}
function render(keepScroll) {
  const m = match(); const sameRoute = curRoute === location.hash; curRoute = location.hash;
  const y = window.scrollY; const v = $('#view');
  v.innerHTML = m.def.render(m.params);
  $('#title').textContent = typeof m.def.title === 'function' ? m.def.title(m.params) : m.def.title;
  $('#back').classList.toggle('hide', !m.def.back);
  $('#back').dataset.to = m.def.back ? (typeof m.def.back === 'function' ? m.def.back(m.params) : m.def.back) : '';
  $$('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === m.def.tab));
  $$('.prof button').forEach(b => b.classList.toggle('on', b.dataset.p === curId()));
  if (!sameRoute) v.style.animation = 'none', v.offsetHeight, v.style.animation = '';
  window.scrollTo(0, (keepScroll || sameRoute) ? y : 0);
  m.def.after && m.def.after(m.params);
}
window.addEventListener('hashchange', () => { closeSheet(); render(); });

document.addEventListener('click', e => {
  const z = e.target.closest('img[data-zoom]'); if (z) { zoom(z.src, z.alt); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const fn = Actions[a.dataset.act]; if (fn) { e.preventDefault(); fn(a, e); }

document.addEventListener('input', e => { const a = e.target.closest('[data-in]'); if (a && Inputs[a.dataset.in]) Inputs[a.dataset.in](a, e); });
document.addEventListener('change', e => { const a = e.target.closest('[data-ch]'); if (a && Inputs[a.dataset.ch]) Inputs[a.dataset.ch](a, e); });

function importJSON(file) {

    try {
      const o = JSON.parse(r.result);
      if (o.app !== 'treino-lua-may' || !o.data) throw new Error('Arquivo não é um backup deste app');

/* =====================================================================
   SERVICE WORKER + atualização sem perder dados
   ===================================================================== */
function registerSW() {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  navigator.serviceWorker.register('./sw.js').then(reg => {
    const ask = w => {
      const b = $('#upd'); b.classList.remove('hide');
      b.onclick = () => { w.postMessage('skipWaiting'); };
    };
    if (reg.waiting) ask(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) ask(w); });
    });
    setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
  }).catch(e => console.warn('SW', e));
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded) { reloaded = true; location.reload(); } });
}

function retomadaEnds(p = P()) { return addDays(parseISO(p.startDate), (p.retWeeks || 2) * 7); }

/* Última execução de um exercício (ignora a sessão atual) */
function lastPerf(exId, skipId, id = curId()) {
  const arr = sessions(id);
  for (let i = arr.length - 1; i >= 0; i--) {
    const s = arr[i]; if (s.id === skipId || s.type !== 'treino') continue;
    const ex = s.exercises.find(e => e.exId === exId);
    if (ex && ex.sets.some(st => st.done)) return { date: s.date, ex, sets: ex.sets.filter(st => st.done) };
  }
  return null;
}
const e1rm = (k, r) => k > 0 && r > 0 ? k * (1 + r / 30) : 0;   // Epley
/* Recorde pessoal: maior carga (desempate por reps) e melhor 1RM estimado */
function personalRecord(exId, skipId, id = curId()) {
  let best = null, bestE = 0;
  for (const s of sessions(id)) {
    if (s.id === skipId || s.type !== 'treino') continue;
    const ex = s.exercises.find(e => e.exId === exId); if (!ex) continue;
    for (const st of ex.sets) {
      if (!st.done || !st.reps) continue; const k = st.kg || 0;
      if (!best || k > best.kg || (k === best.kg && st.reps > best.reps)) best = { kg: k, reps: st.reps, date: s.date };
      bestE = Math.max(bestE, e1rm(k, st.reps));
    }
  }
  return best ? Object.assign(best, { e1rm: bestE }) : null;
}
const perfTxt = sets => sets.length ? `${nf(sets[0].kg || 0, 2)} kg × ${sets.map(s => s.reps ?? '–').join('/')}` : '–';

/* Sugestão de progressão (nunca automática). Regras do plano. */
function progressionHint(exId, max, skipId) {
  const last = lastPerf(exId, skipId); if (!last) return null;
  const ex = last.ex;
  if (ex.pain) return null;
  if (ex.rir === 0) return null;                          // sem reserva
  if (ex.sets.some(s => !s.done)) return null;            // não completou todas as séries
  if (!ex.sets.every(s => (s.reps || 0) >= max)) return null;
  const top = Math.max(...ex.sets.map(s => s.kg || 0));
  const inc = incFor(exId);
  return { from: top, to: Math.round((top + inc) * 100) / 100, inc,
    why: `Em ${fmtDate(last.date, { day: '2-digit', month: '2-digit' })}, todas as ${ex.sets.length} séries chegaram a ${max} reps (topo da faixa) sem dor${ex.rir != null ? `, com RIR ${ex.rir}` : ''}.` };
}

/* ---------- Criação de sessão a partir do plano ---------- */
function buildSession(dow, date = new Date()) {
  const p = P(), day = planDay(dow, p), ret = isRetomada(p, date);
  const s = { id: uid(), date: isoDate(date), dow, title: day.title, type: day.type, start: Date.now(), end: null,
    mode: ret ? 'retomada' : 'completo', rest: null, exercises: [] };
  if (day.type !== 'treino') return s;
  s.exercises = day.exercises.map(e => {
    const info = exInfo(e.id, p), last = lastPerf(e.id);
    const n = ret ? Math.min(2, e.sets) : e.sets;
    const sets = Array.from({ length: n }, (_, i) => {
      const src = last ? (last.sets[i] || last.sets[last.sets.length - 1]) : null;
      return { kg: src ? src.kg : null, reps: src ? src.reps : null, done: false };
    });
    return { exId: e.id, name: info.name, min: e.min, max: e.max, planned: e.sets, sets, rir: null, note: '', pain: false };
  });
  return s;
}

  src: 'draft', hid: null,

};

/* ---------- Timer de descanso (baseado em timestamp) ---------- */
const Rest = {
  iv: null,
  start(sec, label) {
    const d = getDraft(); if (!d) return;
    d.rest = { endsAt: Date.now() + sec * 1000, dur: sec, label, fired: false }; saveDraft(d); this.show();
  },
  adjust(delta) { const d = getDraft(); if (!d?.rest) return; d.rest.endsAt += delta * 1000; d.rest.dur += delta; if (d.rest.endsAt > Date.now()) d.rest.fired = false; saveDraft(d); this.tick(); },
  stop() { const d = getDraft(); if (d) { d.rest = null; saveDraft(d); } $('#rest')?.remove(); clearInterval(this.iv); this.iv = null; },
  show() {
    const d = getDraft(); if (!d?.rest) { $('#rest')?.remove(); return; }
    let el = $('#rest');
    if (!el) {
      el = document.createElement('div'); el.id = 'rest'; el.setAttribute('role', 'timer');
      el.innerHTML = `<div class="row sp"><div><div class="xs mut" id="rlab"></div><div class="t" id="rt">0:00</div></div>
      <div class="row"><button class="btn icon" data-act="rest-adj" data-d="-15" aria-label="Menos 15 segundos">−15</button>
      <button class="btn icon" data-act="rest-adj" data-d="15" aria-label="Mais 15 segundos">+15</button>
      <button class="btn sec" data-act="rest-skip">Pular</button></div></div><div class="prog" style="margin-top:6px"><i id="rbar"></i></div>`;
      document.body.append(el);
    }
    clearInterval(this.iv); this.iv = setInterval(() => this.tick(), 250); this.tick();
  },
  tick() {
    const d = getDraft(), el = $('#rest'); if (!d?.rest || !el) { this.stop(); return; }
    const left = (d.rest.endsAt - Date.now()) / 1000;
    $('#rlab').textContent = left > 0 ? `Descanso · ${d.rest.label || ''}` : 'Descanso concluído — próxima série';
    $('#rt').textContent = left > 0 ? fmtSec(left) : '+' + fmtSec(-left);
    $('#rbar').style.width = clamp(100 - (left / d.rest.dur) * 100, 0, 100) + '%';
    el.classList.toggle('over', left <= 0);
    if (left <= 0 && !d.rest.fired) {
      d.rest.fired = true; saveDraft(d);
      if (document.visibilityState === 'visible') Sound.beep(3);
    }
    if (left < -180) this.stop();   // some sozinho 3 min após terminar
  }
};
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Rest.show(); });

function resizeImage(file, max = 900) {
  return new Promise((res, rej) => {
    const img = new Image(); img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src); res(c.toDataURL('image/jpeg', 0.8));
    }; img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}

/* ---------- Finalizar / descartar ---------- */
function sessionStats(s, skipPRs) {
  let vol = 0, done = 0, tot = 0; const prs = [];
  for (const ex of s.exercises) {
    tot += ex.sets.length;
    for (const st of ex.sets) if (st.done) { done++; vol += (st.kg || 0) * (st.reps || 0); }
    if (skipPRs) continue;
    const prev = personalRecord(ex.exId, s.id);
    const best = ex.sets.filter(x => x.done && x.reps).sort((a, b) => (b.kg || 0) - (a.kg || 0) || b.reps - a.reps)[0];
    if (best && prev && ((best.kg || 0) > prev.kg || ((best.kg || 0) === prev.kg && best.reps > prev.reps)))
      prs.push(`${ex.name}: ${nf(best.kg || 0, 2)} kg × ${best.reps}`);
  }
  return { vol, done, tot, prs, dur: (s.end || Date.now()) - s.start };
}
Actions['finish'] = () => {
  const s = getDraft(); const st = sessionStats(s, true);
  const msg = st.done === 0 ? 'Nenhuma série concluída. Finalizar mesmo assim?' : st.done < st.tot ? `${st.tot - st.done} séries não marcadas. Finalizar?` : 'Finalizar e salvar o treino?';
  confirmSheet(msg, 'Finalizar', () => {
    s.end = Date.now(); const stats = sessionStats(s); s.prs = stats.prs; delete s.rest;
    const arr = sessions(); arr.push(s); saveSessions(arr);
    Store.del('draft:' + curId()); Rest.stop(); Wake.off();
    Hooks.afterFinish.forEach(f => f(s));
    go('#/treino/resumo/' + s.id);
  });
};
Actions['discard'] = () => confirmSheet('Descartar o treino em andamento? Os registros desta sessão serão perdidos.', 'Descartar', () => {
  Store.del('draft:' + curId()); Rest.stop(); Wake.off(); go('#/hoje');
}, true);

/* =====================================================================
   FASE 2 — ALIMENTAÇÃO: metas, macros, registro do dia, planejador,
   receitas escaláveis, lista de compras automática
   ===================================================================== */

/* ---------- Tabela de alimentos (TACO + edições do usuário) ---------- */
const foods = () => { const o = Store.get('foods', {}); const r = {}; for (const k in FOODS) r[k] = Object.assign({}, FOODS[k], o[k] || {}, o[k] ? { edited: true } : {}); return r; };
const Z = () => ({ kcal: 0, p: 0, c: 0, f: 0 });
const addM = (a, b, k = 1) => { a.kcal += b.kcal * k; a.p += b.p * k; a.c += b.c * k; a.f += b.f * k; return a; };
function ingMacros(ing, F = foods()) {
  const f = F[ing.food]; if (!f || f.trace || !ing.g) return Z();
  const k = ing.g / 100; return { kcal: f.kcal * k, p: f.p * k, c: f.c * k, f: f.f * k };
}
/* Macros de 1 porção-base (estimativa). unsure = algum item incerto/assumido */
function recipeMacros(id) {
  const r = recipe(id), F = foods(), m = Z(); let unsure = false;
  r.ing.forEach(i => { addM(m, ingMacros(i, F)); if (i.assumed || F[i.food]?.unsure) unsure = true; });
  m.unsure = unsure; return m;
}
const mTxt = (m, k = 1) => `${nf(m.kcal * k)} kcal · ${nf(m.p * k)} g prot`;

/* ---------- Metas ---------- */
const ACT = [[1.2, 'Sedentário'], [1.375, 'Leve (1–3×/sem)'], [1.55, 'Moderado (3–5×/sem)'], [1.725, 'Intenso (6–7×/sem)']];
const GOALS = [['perder', 'Perder gordura', -0.10], ['manter', 'Manter', 0], ['ganhar', 'Ganhar massa', 0.10]];
function suggestGoals(p) {
  const bmr = 10 * p.weightKg + 6.25 * p.heightCm - 5 * p.age + (p.sex === 'F' ? -161 : 5);   // Mifflin-St Jeor
  const adj = (GOALS.find(g => g[0] === p.goal) || GOALS[1])[2];
  const kcal = Math.round(bmr * (p.activity || 1.55) * (1 + adj) / 10) * 10;
  const prot = Math.round(1.6 * p.weightKg), fat = Math.round(kcal * 0.25 / 9);
  const carb = Math.max(0, Math.round((kcal - prot * 4 - fat * 9) / 4));
  return { kcal, p: prot, c: carb, f: fat, water: Math.round(35 * p.weightKg / 50) * 50, bmr: Math.round(bmr) };
}
const isTrainDay = (d = new Date(), p = P()) => planDay(d.getDay(), p).type === 'treino';
/* Meta do dia: base + ajuste leve em dia de treino (+5%) ou descanso (−5%), via carboidratos */
function goalsFor(date = new Date(), p = P()) {
  const g = Object.assign({}, p.goals || suggestGoals(p));
  if (p.trainAdj) { const d = Math.round(g.kcal * 0.05) * (isTrainDay(date, p) ? 1 : -1); g.kcal += d; g.c = Math.max(0, g.c + Math.round(d / 4)); g.adj = d; }
  return g;
}

/* ---------- Planejador semanal (por perfil e semana) ---------- */
const menuKey = (wk, id = curId()) => `menu:${id}:${wk}`;
const getMenu = (wk, id = curId()) => Store.get(menuKey(wk, id)) || clone(DEFAULT_MENU);
const setMenu = (wk, m, id = curId()) => Store.set(menuKey(wk, id), m);
const plannedRecipe = (date, k, id = curId()) => getMenu(weekKey(date), id)[monIdx(date)][k];

/* ---------- Registro do dia ---------- */
const logKey = (ds, id = curId()) => `food:${id}:${ds}`;
const getLog = (ds, id = curId()) => Store.get(logKey(ds, id)) || { meals: {}, extras: [], water: 0 };
const setLog = (ds, l, id = curId()) => Store.set(logKey(ds, id), l);
function mealState(date, k, p = P()) {
  const l = getLog(isoDate(date)), m = l.meals[k] || {};
  return { recipe: m.recipe || plannedRecipe(date, k), status: m.status || null, mult: m.mult ?? (p.portion?.[k] || 1), swapped: !!m.recipe };
}
/* Totais: consumido (marcado) e previsão (consumido + refeições ainda não marcadas) */
function dayTotals(date, p = P()) {
  const l = getLog(isoDate(date)), eaten = Z(), forecast = Z();
  MEALS.forEach(({ k }) => {
    const s = mealState(date, k, p), m = recipeMacros(s.recipe);
    if (s.status === 'comi' || s.status === 'troquei') { addM(eaten, m, s.mult); addM(forecast, m, s.mult); }
    else if (!s.status) addM(forecast, m, s.mult);
  });
  l.extras.forEach(x => { const m = { kcal: x.kcal || 0, p: x.p || 0, c: x.c || 0, f: x.f || 0 }; addM(eaten, m); addM(forecast, m); });
  return { eaten, forecast, water: l.water || 0 };
}
let foodDate = null;
const fDate = () => foodDate || new Date();

/* ---------- Componentes visuais ---------- */
function ring(val, goal, label, unit) {
  const r = 38, C = 2 * Math.PI * r, pct = goal ? Math.min(1, val / goal) : 0, over = goal && val > goal * 1.1;
  return `<div class="ring"><svg viewBox="0 0 92 92" role="img" aria-label="${label}: ${nf(val)} de ${nf(goal)} ${unit}">
    <circle cx="46" cy="46" r="${r}" fill="none" stroke="var(--line)" stroke-width="9"/>
    <circle cx="46" cy="46" r="${r}" fill="none" stroke="${over ? 'var(--warn)' : 'var(--ac)'}" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}" transform="rotate(-90 46 46)"/>
    <text x="46" y="44" text-anchor="middle" font-size="17" font-weight="800" fill="var(--tx)">${nf(val)}</text>
    <text x="46" y="60" text-anchor="middle" font-size="10" fill="var(--mut)">/ ${nf(goal)} ${unit}</text></svg>${label}</div>`;
}
function bar(label, val, goal, unit) {
  const pct = goal ? Math.min(100, val / goal * 100) : 0;
  return `<div class="bar"><div class="l"><span>${label}</span><span>${nf(val)} / ${nf(goal)} ${unit}</span></div><div class="prog"><i class="${goal && val > goal * 1.1 ? 'over' : ''}" style="width:${pct}%"></i></div></div>`;
}
const EST = '<span class="est" title="Estimativa">ESTIMATIVA</span>';
const foodNav = cur => `<div class="seg" style="margin-bottom:10px">${[['', 'Hoje'], ['semana', 'Semana'], ['receitas', 'Receitas'], ['compras', 'Compras']].map(([k, n]) => `<button class="${cur === k ? 'on' : ''}" data-act="go" data-to="#/comida${k ? '/' + k : ''}">${n}</button>`).join('')}</div>`;

/* Sugestões para fechar a proteína */
function proteinSuggestions(missing) {
  const list = RECIPES.map(r => ({ r, m: recipeMacros(r.id) })).filter(x => x.m.p >= 10)
    .sort((a, b) => (Math.abs(a.m.p - missing) - Math.abs(b.m.p - missing)) || (b.m.p / b.m.kcal - a.m.p / a.m.kcal));
  const lanches = list.filter(x => x.r.cat === 'lanche'), outros = list.filter(x => x.r.cat !== 'lanche');
  return [...lanches.slice(0, 2), ...outros.slice(0, 1)];
}

Actions['plan-shuffle'] = () => {
  const wk = curPlanWk(), rate = Store.get('rate:' + curId(), {}), m = [];
  for (let i = 0; i < 7; i++) {
    m[i] = {};
    MEALS.forEach(({ k }) => {
      const pool = RECIPES.filter(r => r.cat === k && (i === 0 || r.id !== m[i - 1][k]) && (rate[r.id] || 3) > 1);
      const list = pool.length ? pool : RECIPES.filter(r => r.cat === k && (i === 0 || r.id !== m[i - 1][k]));
      const w = list.map(r => 1 + (rate[r.id] || 3)), tot = w.reduce((a, b) => a + b, 0); let x = Math.random() * tot, pick = list[0];
      for (let j = 0; j < list.length; j++) { x -= w[j]; if (x <= 0) { pick = list[j]; break; } }
      m[i][k] = pick.id;
    });
  }
  setMenu(wk, m); toast('Semana sorteada'); render(true);
};

let shopWeek = null, shopPeople = { lua: true, may: true };
function buildShop(wk) {
  const items = {};   // food -> {g, count, unit, trace}
  for (const id of Object.keys(shopPeople).filter(x => shopPeople[x])) {
    const p = Store.get('profile:' + id), menu = getMenu(wk, id);
    menu.forEach(day => MEALS.forEach(({ k }) => {
      const r = recipe(day[k]), mult = p.portion?.[k] || 1;
      r.ing.forEach(i => {
        const it = items[i.food] = items[i.food] || { g: 0, count: 0, unit: i.unit, trace: true };
        if (i.g || i.q) it.trace = false;
        it.g += i.g * mult; if (['un', 'fatia', 'lata'].includes(i.unit)) { it.count += i.q * mult; it.unit = i.unit; }
        if (i.unit === 'ml') it.unit = 'ml';
      });
    }));
  }
  return items;
}

function shopQty(food, it) {

  if (it.unit === 'ml') return it.g >= 1000 ? `${nf(it.g / 1000, 1)} L` : `${nf(it.g)} ml`;

}

/* ---------- Gráficos em SVG puro ---------- */
function lineChart(series, { unit = '', h = 180 } = {}) {
  const W = 340, H = h, L = 36, R = 8, T = 10, B = 22;
  const all = series.flatMap(s => s.pts); if (all.length < 1) return '<p class="sm mut">Sem dados suficientes ainda.</p>';
  const xs = all.map(p => p.x), ys = all.map(p => p.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= 864e5; x1 += 864e5; }
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = (y1 - y0) * 0.15 || Math.max(1, y1 * 0.1); y0 = Math.max(0, y0 - pad); y1 += pad;
  const X = x => L + (x - x0) / (x1 - x0) * (W - L - R), Y = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  let g = '';
  for (let i = 0; i <= 3; i++) { const v = y0 + (y1 - y0) * i / 3; g += `<line class="gd" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 4}" y="${Y(v) + 3}" text-anchor="end">${nf(v, (y1 - y0) < 10 ? 1 : 0)}</text>`; }
  const d = t => new Date(t).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  g += `<text x="${L}" y="${H - 6}">${d(x0)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${d(x1)}</text>`;
  series.forEach(s => {
    if (!s.pts.length) return; const pts = s.pts.slice().sort((a, b) => a.x - b.x);
    g += `<polyline class="${s.cls || 'ln'}" points="${pts.map(p => `${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ')}"/>`;
    if (!s.cls) g += pts.map(p => `<circle class="dt" cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="2.6"/>`).join('');
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico ${esc(unit)}">${g}</svg>`;
}
function barChart(items, { target = null, h = 150, fmt = v => nf(v) } = {}) {
  const W = 340, H = h, L = 8, R = 8, T = 14, B = 20, max = Math.max(1, target || 0, ...items.map(i => i.v)), bw = (W - L - R) / items.length;
  let g = '';
  items.forEach((it, i) => {
    const bh = (it.v / max) * (H - T - B), x = L + i * bw + bw * 0.15;
    g += `<rect class="bx" x="${x.toFixed(1)}" y="${(H - B - bh).toFixed(1)}" width="${(bw * 0.7).toFixed(1)}" height="${Math.max(0, bh).toFixed(1)}" rx="3" opacity="${it.cur ? 1 : 0.7}"/>`;
    if (it.v) g += `<text x="${(x + bw * 0.35).toFixed(1)}" y="${(H - B - bh - 3).toFixed(1)}" text-anchor="middle">${fmt(it.v)}</text>`;
    if (i % 2 === items.length % 2 || items.length <= 8) g += `<text x="${(x + bw * 0.35).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(it.l)}</text>`;
  });
  if (target) { const y = H - B - target / max * (H - T - B); g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--warn)" stroke-dasharray="4 3"/>`; }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

/* ---------- Agregações ---------- */
const plannedPerWeek = (p = P()) => [0, 1, 2, 3, 4, 5, 6].filter(d => planDay(d, p).type === 'treino').length;
function weekAgg(ws, id = curId()) {
  const a = isoDate(ws), b = isoDate(addDays(ws, 7)), arr = sessions(id).filter(s => s.date >= a && s.date < b);
  const tr = arr.filter(s => s.type === 'treino');
  return { trainings: tr.length, walks: arr.filter(s => s.type === 'recuperacao').length, walkMin: arr.reduce((x, s) => x + (s.walkMin || 0), 0),
    vol: tr.reduce((x, s) => x + sessionStats(s, true).vol, 0), prs: tr.flatMap(s => s.prs || []) };
}
function weekFood(ws, p = P()) {
  let meals = 0, ok = 0, water = 0, waterHit = 0, days = 0;
  for (let i = 0; i < 7; i++) {
    const d = addDays(ws, i); if (d > new Date()) break; days++;
    const l = getLog(isoDate(d), p.id);
    MEALS.forEach(({ k }) => { meals++; const st = l.meals[k]?.status; if (st === 'comi' || st === 'troquei') ok++; });
    water += l.water || 0; if ((l.water || 0) >= goalsFor(d, p).water) waterHit++;
  }
  return { adherence: meals ? ok / meals : 0, waterAvg: days ? water / days : 0, waterHit, days };
}
/* Semana consistente = pelo menos 3 treinos (ou todos os planejados, se forem menos) */
function streak(id = curId()) {
  const need = Math.min(3, plannedPerWeek(Store.get('profile:' + id)) || 3); let n = 0, ws = weekStart();
  if (weekAgg(ws, id).trainings >= need) n++;
  ws = addDays(ws, -7);
  while (weekAgg(ws, id).trainings >= need) { n++; ws = addDays(ws, -7); if (n > 520) break; }
  return { n, need };
}

/* ---------- Lembretes .ics (Calendário do iPhone) ---------- */
const icsEsc = s => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
function buildICS(p, time, alarmMin) {
  const BY = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'], [hh, mm] = time.split(':').map(Number);
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Lua e May//Treino//PT-BR', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', `X-WR-CALNAME:Treino ${icsEsc(p.name)}`];
  for (const dow of [1, 2, 3, 4, 5]) {
    const day = planDay(dow, p); if (day.type === 'descanso') continue;
    let d = new Date(); d.setHours(0, 0, 0, 0); while (d.getDay() !== dow) d = addDays(d, 1);
    const dt = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(hh)}${pad(mm)}00`;
    const title = day.type === 'treino' ? `Treino · ${day.title}` : 'Recuperação ativa · caminhada';
    const desc = day.type === 'treino' ? day.exercises.map(e => `${exInfo(e.id, p).name} ${e.sets}×${e.min}–${e.max}`).join('\n') + '\n\n' + TXT.seguranca : REC.text;
    L.push('BEGIN:VEVENT', `UID:${p.id}-${dow}-${uid()}@treino-lua-may`, `DTSTAMP:${stamp}`, `DTSTART:${dt}`, `DURATION:${day.type === 'treino' ? 'PT1H' : 'PT30M'}`,
      `RRULE:FREQ=WEEKLY;BYDAY=${BY[dow]}`, `SUMMARY:${icsEsc(title + ' (' + p.name + ')')}`, `DESCRIPTION:${icsEsc(desc)}`);
    if (alarmMin >= 0) L.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(title)}`, `TRIGGER:-PT${alarmMin}M`, 'END:VALARM');
    L.push('END:VEVENT');
  }
  L.push('END:VCALENDAR');
  /* Dobra linhas longas (RFC 5545: 75 octetos) */
  const enc = new TextEncoder();
  const fold = l => { let o = '', cur = '', n = 0; for (const ch of l) { const b = enc.encode(ch).length; if (n + b > 73) { o += cur + '\r\n '; cur = ''; n = 1; } cur += ch; n += b; } return o + cur; };
  return L.map(fold).join('\r\n') + '\r\n';
}
function icsView() {
  const p = P();
  return `<div class="card"><h3>Lembretes no Calendário</h3><p class="sm">Gera um arquivo <b>.ics</b> com eventos semanais recorrentes (seg–sex, incluindo a caminhada de quarta) do plano de ${esc(p.name)}.</p>
  <label class="fld"><span>Horário do treino</span><input type="time" id="icsT" value="${p.icsTime || '18:30'}"></label>
  <label class="fld"><span>Alerta</span><select id="icsA"><option value="0">Na hora</option><option value="15" selected>15 min antes</option><option value="30">30 min antes</option><option value="60">1 h antes</option><option value="-1">Sem alerta</option></select></label>
  <button class="btn pri wide" data-act="ics">Gerar e abrir/compartilhar .ics</button></div>
  <div class="card"><h3>Como importar no iPhone</h3><ol class="sm"><li>Toque em “Gerar”. Na folha de compartilhamento, escolha <b>Salvar em Arquivos</b>.</li><li>Abra o app <b>Arquivos</b> e toque no arquivo .ics.</li><li>Toque em <b>Adicionar Tudo</b> e escolha o calendário.</li></ol>
  <p class="xs mut">Se o plano mudar, apague os eventos antigos no Calendário e gere de novo.</p></div>`;

    ${f('Nome', `<input type="text" data-ch="pf" data-f="name" value="${esc(p.name)}">`)}
    <div class="grid2">${f('Idade', stepper('age', p.age, 1, 'data-ch="pf" data-f="age"', 'numeric'))}
    ${f('Sexo', `<select data-ch="pf" data-f="sex"><option value="M" ${p.sex === 'M' ? 'selected' : ''}>Masculino</option><option value="F" ${p.sex === 'F' ? 'selected' : ''}>Feminino</option></select>`)}
    ${f('Altura (cm)', stepper('h', p.heightCm, 1, 'data-ch="pf" data-f="heightCm"', 'numeric'))}
    ${f('Peso (kg)', stepper('w', p.weightKg, 0.5, 'data-ch="pf" data-f="weightKg"'))}</div>
    ${f('Foco', `<input type="text" data-ch="pf" data-f="focus" value="${esc(p.focus)}">`)}</div>
  <div class="card"><h3>Treino</h3>
    ${f('Início da retomada', `<input type="date" data-ch="pf" data-f="startDate" value="${p.startDate}">`)}
    <div class="grid2">${f('Semanas de retomada', stepper('rw', p.retWeeks, 1, 'data-ch="pf" data-f="retWeeks"', 'numeric'))}
    ${f('Descanso padrão (s)', stepper('rs', p.restSec, 15, 'data-ch="pf" data-f="restSec"', 'numeric'))}
    ${f('Incremento padrão (kg)', stepper('inc', p.incDefault, 0.5, 'data-ch="pf" data-f="incDefault"'))}</div>
    <p class="xs mut">Recomendado: descanso de 90–120 s. Incremento por exercício: no menu ⋯ do exercício ou em Editar plano.</p>
    <label class="ck"><input type="checkbox" data-ch="sound" ${meta().sound !== false ? 'checked' : ''}> Aviso sonoro no fim do descanso</label></div>`;
  Hooks.settings.forEach(fn => { h += fn(); });
  h += `<div class="card warnc"><h3>Apagar dados</h3>
    <button class="btn danger wide" data-act="wipe-profile">Apagar dados de ${esc(p.name)}</button>
    <button class="btn danger wide" style="margin-top:8px" data-act="wipe-all">Apagar TUDO (os dois perfis)</button>
    <p class="xs mut">Faça um backup antes. Não há como desfazer.</p></div>`;
  return h;
}
Inputs['pf'] = el => {
  const p = P(), k = el.dataset.f; let v = el.value;
  if (['age', 'heightCm', 'weightKg', 'retWeeks', 'restSec', 'incDefault'].includes(k)) { v = num(v); if (v == null || v < 0) return; }
  if (k === 'startDate' || k === 'retWeeks') p.modeNotified = false;
  p[k] = v; saveP(p);
  if (k === 'name') render(true);
};
Inputs['sound'] = el => setMeta({ sound: el.checked });
Actions['wipe-profile'] = () => confirmSheet(`Apagar todo o histórico, rascunho e ajustes de ${P().name}?`, 'Apagar', () => {
  const id = curId(); Store.keys('').filter(k => k.endsWith(':' + id) || k.includes(':' + id + ':')).forEach(k => Store.del(k));
  Store.set('profile:' + id, newProfile(id)); Rest.stop(); toast('Dados do perfil apagados'); go('#/hoje');
}, true);
Actions['wipe-all'] = () => confirmSheet('Apagar TODOS os dados do app neste iPhone?', 'Apagar tudo', async () => {
  await DB.clear(); Store.d = {}; runMigrations(); ensureProfiles(); Rest.stop(); toast('Tudo apagado'); go('#/hoje');
}, true);

async function storageInfo() {
  const el = $('#stinfo'); if (!el) return;
  let t = `Armazenamento: <b>${DB.mode === 'idb' ? 'IndexedDB' : 'localStorage (modo reduzido)'}</b>`;
  try {
    if (navigator.storage?.persisted) t += ` · persistente: <b>${(await navigator.storage.persisted()) ? 'sim' : 'não (o iOS pode limpar se ficar sem uso)'}</b>`;
    if (navigator.storage?.estimate) { const e = await navigator.storage.estimate(); t += ` · uso: ${nf((e.usage || 0) / 1048576, 1)} MB`; }
  } catch (e) {}
  el.innerHTML = t;
}
function backupView() {
  const lb = meta().lastBackup;
  return `<div class="card"><h3>Backup completo (JSON)</h3><p class="sm mut">Os dois perfis, histórico, cardápio e configurações. Salve em “Arquivos” ou envie para você mesmo.</p>
    <p class="sm">Último backup: <b>${lb ? fmtDate(new Date(lb)) + ' ' + fmtTime(lb) : 'nunca'}</b></p>
    <button class="btn pri wide" data-act="backup-now">Exportar backup</button>
    <label class="btn wide" style="margin-top:8px">Restaurar de um arquivo<input type="file" accept="application/json,.json" data-ch="import" class="hide"></label></div>
  <div class="card"><h3>Histórico em planilha (CSV)</h3><p class="sm mut">Uma linha por série, separador “;” (abre no Excel/Numbers).</p>
    <button class="btn wide" data-act="csv">Exportar CSV</button></div>
  <div class="card"><p class="sm" id="stinfo">…</p><button class="btn sm" data-act="persist">Pedir armazenamento persistente</button>
  <p class="xs mut">No iPhone, instalar na Tela de Início e usar o app com frequência reduz o risco de o sistema apagar os dados. Mesmo assim, faça backup semanal.</p></div>`;
}
Inputs['import'] = el => { if (el.files[0]) importJSON(el.files[0]); el.value = ''; };
Actions['csv'] = () => exportCSV();
Actions['persist'] = async () => { await askPersist(); storageInfo(); };

function aboutView() {
  return `<div class="card"><h3>Instalar no iPhone</h3><ol><li>Abra o link do app no <b>Safari</b>.</li><li>Toque em <b>Compartilhar</b> (quadrado com seta).</li><li>Escolha <b>Adicionar à Tela de Início</b> → Adicionar.</li><li>Abra pelo ícone. Depois do primeiro acesso, funciona offline.</li></ol></div>
  <div class="card"><h3>Atualizações</h3><p class="sm">Quando houver versão nova, aparece o botão <b>“Nova versão — atualizar”</b> no topo. Os dados ficam no banco do aparelho e <b>não são apagados</b> pela atualização.</p></div>
  <div class="card"><h3>Dois perfis</h3><p class="sm">Use o seletor Luã/May no topo. Cada perfil tem histórico, plano e metas separados. O app lembra o último perfil usado.</p></div>`;
}

/* ---------- Rotas gerais ---------- */
route('/hoje', { tab: 'hoje', title: 'Hoje', render: todayView });
route('/mais', { tab: 'mais', title: 'Mais', render: moreView });
route('/mais/config', { tab: 'mais', title: 'Configurações', back: '#/mais', render: configView });
route('/mais/backup', { tab: 'mais', title: 'Backup e dados', back: '#/mais', render: backupView, after: storageInfo });
route('/mais/regras', { tab: 'mais', title: 'Regras e segurança', back: '#/mais', render: rulesView });
route('/mais/sobre', { tab: 'mais', title: 'Instalar e atualizar', back: '#/mais', render: aboutView });

/* ---------- Inicialização ---------- */
async function boot() {
  await DB.open();
  Store.d = await DB.all();
  runMigrations(); ensureProfiles();
  if (!meta().lastProfile) setMeta({ lastProfile: 'lua' });
  if (!location.hash) history.replaceState(null, '', '#/hoje');
  render();
  Rest.show();
  document.addEventListener('touchend', () => Sound.unlock(), { once: true });
  setTimeout(askPersist, 3000);
  registerSW();
}
boot();

</script>
</body>
</html>
