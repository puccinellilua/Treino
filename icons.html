<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gerador de ícones · Luã &amp; May</title>
<style>body{font:16px -apple-system,Arial,sans-serif;background:#0b1220;color:#edf3fb;padding:20px;max-width:720px;margin:auto}
a{color:#71e7ca}.it{display:flex;gap:14px;align-items:center;margin:14px 0}canvas{border-radius:22%;background:#000;width:96px;height:96px}
.btn{display:inline-block;padding:12px 16px;border-radius:12px;background:#71e7ca;color:#06231c;font-weight:700;text-decoration:none}</style></head>
<body>
<h1>Ícones do app</h1>
<p>Gera os PNG (180, 192, 512 e 512 maskable) via canvas. Toque em cada botão para baixar e coloque os arquivos na pasta <b>icons/</b> do repositório.</p>
<div id="out"></div>
<script>
/* Desenha o ícone: fundo escuro, halter em destaque e "L&M" */
function draw(size, maskable) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d'), s = size / 512;
  x.fillStyle = '#0b1220'; x.fillRect(0, 0, size, size);
  const g = x.createRadialGradient(256 * s, 200 * s, 20 * s, 256 * s, 256 * s, 360 * s);
  g.addColorStop(0, '#1d3a4a'); g.addColorStop(1, '#0b1220'); x.fillStyle = g; x.fillRect(0, 0, size, size);
  const k = maskable ? 0.78 : 1;                         // área segura do maskable
  x.save(); x.translate(256 * s, 256 * s); x.scale(k, k); x.translate(-256 * s, -256 * s);
  x.fillStyle = '#71e7ca';
  const r = (X, Y, W, H, R) => { x.beginPath(); if (x.roundRect) x.roundRect(X * s, Y * s, W * s, H * s, R * s); else x.rect(X * s, Y * s, W * s, H * s); x.fill(); };
  r(96, 150, 44, 150, 14); r(372, 150, 44, 150, 14);     // anilhas grandes
  r(62, 180, 34, 90, 10);  r(416, 180, 34, 90, 10);      // anilhas pequenas
  r(140, 210, 232, 30, 12);                              // barra
  x.fillStyle = '#edf3fb'; x.font = `800 ${92 * s}px -apple-system, "SF Pro Display", Arial, sans-serif`;
  x.textAlign = 'center'; x.textBaseline = 'alphabetic'; x.fillText('L&M', 256 * s, 410 * s);
  x.restore();
  return c;
}
const list = [[180, false, 'icon-180.png'], [192, false, 'icon-192.png'], [512, false, 'icon-512.png'], [512, true, 'icon-512-maskable.png']];
window.ICONS = {};
for (const [sz, m, name] of list) {
  const c = draw(sz, m), url = c.toDataURL('image/png'); window.ICONS[name] = url;
  const d = document.createElement('div'); d.className = 'it'; d.append(c);
  const a = document.createElement('a'); a.className = 'btn'; a.href = url; a.download = name; a.textContent = 'Baixar ' + name;
  d.append(a); document.getElementById('out').append(d);
}
</script>
<p style="color:#b3c2d5;font-size:14px">No iPhone: toque e segure a imagem → “Salvar em Arquivos”. O iOS usa o <b>icon-180.png</b> como ícone da Tela de Início (PNG, não SVG).</p>
</body></html>
